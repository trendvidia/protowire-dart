name: Go conformance

# Runs protowire-go, the reference, over every PXF document this repo holds and
# fails when this port's verdict, PB bytes or written PXF differ. A pull request
# runs against the protowire-go tag in tool/go_oracle/go.mod, so it fails only
# for what it changed. The daily run moves to protowire-go's main and compares
# the vendored corpora with the spec's, because a change on either side is
# otherwise invisible here until someone looks.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  conformance:
    name: Dart against protowire-go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - uses: actions/setup-go@v7
        with:
          go-version-file: tool/go_oracle/go.mod
          cache-dependency-path: tool/go_oracle/go.sum

      - run: dart pub get

      - name: Move to protowire-go main
        if: github.event_name == 'schedule'
        working-directory: tool/go_oracle
        run: |
          go get github.com/trendvidia/protowire-go@main
          go mod tidy

      - name: Run the reference
        working-directory: tool/go_oracle
        run: go run . -manifest ../../test/conformance/corpora.json -root ../.. -out "$RUNNER_TEMP/oracle.json"

      - name: Compare
        env:
          GO_ORACLE: ${{ runner.temp }}/oracle.json
          REQUIRE_GO_ORACLE: '1'
        run: dart test test/go_conformance_test.dart

      - uses: actions/checkout@v7
        if: github.event_name == 'schedule'
        with:
          repository: trendvidia/protowire
          path: spec

      - name: Compare the vendored corpora with the spec
        if: github.event_name == 'schedule'
        run: |
          # Only files both sides hold: each keeps some the other does not.
          if diff -rq test/testdata spec/testdata | grep -v '^Only in'; then
            exit 1
          fi
